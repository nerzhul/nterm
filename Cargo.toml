[package]
name = "nterm"
version = "0.2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
gtk4 = "0.11.3"
vte4 = { version = "0.10.0", features = ["v0_78"] }
glib = "0.22.7"
dirs = "6.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"
libc = "0.2.186"
