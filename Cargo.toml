[package]
name = "nterm"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
gtk4 = "0.10.3"
vte4 = { version = "0.9.0", features = ["v0_78"] }
glib = "0.21.5"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
libc = "0.2.180"
